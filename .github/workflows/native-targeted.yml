name: Manual historical source audit
# Daily source/test/build work is native-ios.yml. Old tools and old test methods
# remain in Git; historical reconstruction only runs on an explicit immutable ref.
on:
  workflow_dispatch:
    inputs:
      audit_sha:
        description: Exact published historical SHA to audit, not a daily build
        required: true
        type: string
permissions:
  contents: read
jobs:
  source-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      AUDIT_SHA: ${{ inputs.audit_sha }}
    steps:
      - name: Require an exact immutable audit request
        run: python3 -c 'import os,re; assert re.fullmatch("[a-f0-9]{40}",os.environ["AUDIT_SHA"])'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.audit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Run the chosen version's original source audit explicitly
        run: |
          test "$(git rev-parse HEAD)" = "$AUDIT_SHA"
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          from tools import run_targeted_native as legacy
          root=Path.cwd()
          scope=legacy.verify_product404_scope(root,json.loads((root/'tools/targeted_native_selection.json').read_bytes()))
          print('MANUAL_HISTORICAL_SOURCE_AUDIT_ONLY',json.dumps(scope,sort_keys=True))
          print('No current product test or release admission is claimed by this manual source audit.')
          PY
