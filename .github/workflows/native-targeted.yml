name: Targeted native diagnostics
# Authorized standard-runner split. All three nonempty current1132 partitions must pass
# on this exact SHA/run/attempt; this does not grant release or deployment admission.
on:
  push:
    branches: [migration/native-ios]
    paths:
      - .github/workflows/native-targeted.yml
      - tools/targeted_native_selection.json
      - tools/run_targeted_native.py
      - tools/tests/test_targeted_native.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-targeted-${{ github.ref }}
  cancel-in-progress: true
jobs:
  targeted:
    name: native-targeted-${{ matrix.partition }}
    runs-on: macos-26
    timeout-minutes: 45
    continue-on-error: false
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        partition: [core, app-unit, ui]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record job-entry clock before checkout
        run: python3 -c 'import time,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"native-targeted-start").write_text(str(time.monotonic()))'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Validate direct current1132 controls and source identities
        run: |
          python3 -B tools/run_targeted_native.py preflight --output "$RUNNER_TEMP/native-targeted-preflight.json" --start-file "$RUNNER_TEMP/native-targeted-start"
      - name: Build fresh products and run exact partition methods
        run: python3 -B tools/run_targeted_native.py run-partition --partition '${{ matrix.partition }}' --preflight "$RUNNER_TEMP/native-targeted-preflight.json" --output "$RUNNER_TEMP/native-targeted-${{ matrix.partition }}"
      - name: Re-extract and validate bounded partition evidence
        id: report
        if: always()
        run: |
          python3 -c 'import time,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"native-report-start").write_text(str(time.monotonic()))'
          set +e
          python3 -B tools/run_targeted_native.py report-partition --partition '${{ matrix.partition }}' --output "$RUNNER_TEMP/native-targeted-${{ matrix.partition }}" --evidence "$RUNNER_TEMP/native-evidence-${{ matrix.partition }}" --summary "$GITHUB_STEP_SUMMARY"
          status=$?
          set -e
          python3 -B tools/run_targeted_native.py record-observation --phase report-command --start-file "$RUNNER_TEMP/native-report-start" --returncode "$status" --summary "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Preserve bounded raw schema diagnostics even when admission fails
        if: ${{ always() && matrix.partition != 'core' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-schema-404-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/manifest.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-version.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-summary-help.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-tests-help.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-summary-schema.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-tests-schema.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/simulator-devices.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/simulator-runtimes.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/${{ matrix.partition }}-summary.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/${{ matrix.partition }}-tests.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-version.txt.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-summary-help.txt.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-tests-help.txt.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-summary-schema.json.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/xcresult-tests-schema.json.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/simulator-devices.json.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/simulator-runtimes.json.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/${{ matrix.partition }}-summary.json.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/schema-evidence/${{ matrix.partition }}-tests.json.stderr.txt
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Preserve bounded initial inventory and Core failure diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-command-1132-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/core.xml
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/core-stdout.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/core-stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/core-command.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/inventory-devices.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/inventory-devices.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/inventory-runtimes.json
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/inventory-runtimes.stderr.txt
            ${{ runner.temp }}/native-targeted-${{ matrix.partition }}/command-evidence/inventory-manifest.json
          if-no-files-found: warn
          retention-days: 1
          overwrite: false
      - name: Record immutable artifact upload start
        if: ${{ always() && steps.report.outcome == 'success' }}
        run: python3 -c 'import time,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"native-upload-start").write_text(str(time.monotonic()))'
      - name: Upload only allowlisted receipt and raw result evidence
        id: upload
        if: ${{ always() && steps.report.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-targeted-1132-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: ${{ runner.temp }}/native-evidence-${{ matrix.partition }}/*
          if-no-files-found: error
          retention-days: 1
          overwrite: false
      - name: Record completed artifact upload observation
        if: ${{ always() && steps.upload.outcome == 'success' }}
        run: python3 -B tools/run_targeted_native.py record-observation --phase artifact-upload --start-file "$RUNNER_TEMP/native-upload-start" --returncode 0 --summary "$GITHUB_STEP_SUMMARY"
  aggregate:
    name: native-targeted-diagnostic
    needs: [targeted]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      MATRIX_RESULT: ${{ needs.targeted.result }}
    steps:
      - name: Require every matrix worker to succeed
        run: test "$MATRIX_RESULT" = success
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Record artifact download start
        run: python3 -c 'import time,os,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"native-download-start").write_text(str(time.monotonic()))'
      - name: Download only this SHA run attempt evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-targeted-1132-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/native-targeted-artifacts
          merge-multiple: false
      - name: Reparse exact1132 and verify same-run identities
        run: python3 -B tools/run_targeted_native.py aggregate --start-file "$RUNNER_TEMP/native-download-start" --artifacts "$RUNNER_TEMP/native-targeted-artifacts" --needs-result "$MATRIX_RESULT" --output "$RUNNER_TEMP/native-targeted-1132-receipt.json" --summary "$GITHUB_STEP_SUMMARY"
