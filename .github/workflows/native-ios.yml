name: Native iOS checks
on:
  pull_request:
  push:
    branches: [main, migration/native-ios]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
      - name: Check project and localization structure
        run: |
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s Tests/ContractChecks -p 'test_*.py' -v
          python3 tools/check_scaffold.py
          plutil -lint Questify.xcodeproj/project.pbxproj
          git diff --exit-code -- Questify.xcodeproj
      - name: Run pure Swift domain tests
        run: swift test
      - name: Compile iOS simulator app (unsigned)
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/questify-simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify built CN profile metadata
        run: python3 tools/check_built_profile.py --market CN --plist "$RUNNER_TEMP/questify-simulator/Build/Products/Debug-iphonesimulator/Questify.app/Info.plist"
      - name: Compile iOS device app (unsigned)
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/questify-device" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Compile US regional profile (unsigned)
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify \
            -configuration Release -sdk iphoneos \
            -xcconfig Config/UnitedStates.xcconfig \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/questify-us-device" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify built US profile metadata
        run: python3 tools/check_built_profile.py --market US --plist "$RUNNER_TEMP/questify-us-device/Build/Products/Release-iphoneos/Questify.app/Info.plist"
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_COMMENTS: 'false'
  ui-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    needs: native
    runs-on: macos-26
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/simulators.json'))
          candidates=[d for runtime,devices in data['devices'].items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator; UI tests cannot be claimed as passed')
          chosen=sorted(candidates,key=lambda d:d['name'])[-1]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TEST_SIMULATOR_ID='+chosen['udid']+'\n')
          print('Selected simulator:',chosen['name'])
          PY
      - name: Boot simulator before UI readiness checks
        run: xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
      - name: Test native module flows and session boundaries
        run: |
          python3 tools/run_ui_shard.py --shard ${{ matrix.shard }} --count 3 \
            --simulator "$TEST_SIMULATOR_ID" \
            --derived-data "$RUNNER_TEMP/questify-ui-tests" \
            --result-bundle "$RUNNER_TEMP/questify-ui-results.xcresult"
      - name: Export offline fixture screenshots
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/questify-ui-results.xcresult" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/questify-ui-results.xcresult" \
              --output-path "$RUNNER_TEMP/questify-ui-attachments"
          fi
      - name: Retain synthetic UI screenshots briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-ui-screenshots-${{ github.sha }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/questify-ui-attachments/**/*.png
            ${{ runner.temp }}/questify-ui-attachments/**/*.jpg
            ${{ runner.temp }}/questify-ui-attachments/**/manifest.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
