name: Native iOS checks
on:
  pull_request:
  push:
    branches: [main, migration/native-ios]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-ios-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    name: native-products
    runs-on: macos-26
    # Bounded headroom for Core, source-built GLTF, test bundles and packaging.
    timeout-minutes: 15
    outputs:
      build_fingerprint: ${{ steps.identity.outputs.build_fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Bind builder to exact checked-out SHA and Apple toolchain
        id: identity
        run: python3 tools/ci_gates.py fingerprint --github-output "$GITHUB_OUTPUT"
      - name: Record Apple toolchain
        run: |
          xcodebuild -version
          swift --version
          xcodebuild -showsdks
      - name: Check project and localization structure
        run: |
          echo 'Native-local contracts run in this checkout. External Flutter parity assertions require a separate app-audit checkout; unavailable comparisons are explicitly SKIPPED / NOT_RUN, never passed.'
          python3 -m unittest discover -s tools/tests -v
          python3 -m unittest discover -s Tests/ContractChecks -p 'test_*.py' -v
          python3 tools/check_scaffold.py
          plutil -lint Questify.xcodeproj/project.pbxproj
          git diff --exit-code -- Questify.xcodeproj
      - name: Run pure Swift domain tests
        run: swift test
      - name: Compile iOS simulator app (unsigned)
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/questify-simulator" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify built CN profile metadata
        run: python3 tools/check_built_profile.py --market CN --plist "$RUNNER_TEMP/questify-simulator/Build/Products/Debug-iphonesimulator/Questify.app/Info.plist"
      - name: Verify real source-built GLTFKit2 link and notices (CN)
        run: python3 tools/check_gltf_linked.py --app "$RUNNER_TEMP/questify-simulator/Build/Products/Debug-iphonesimulator/Questify.app"
      - name: Select an available simulator for XCTest compilation
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/build-simulators.json"
          python3 - <<'PYCODE'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/build-simulators.json'))
          candidates=[d for runtime,devices in data['devices'].items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator; XCTest bundle compilation cannot be verified')
          chosen=sorted(candidates,key=lambda d:d['name'])[-1]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('BUILD_TEST_SIMULATOR_ID='+chosen['udid']+'\n')
          print('XCTest compilation simulator:',chosen['name'])
          PYCODE
      - name: Compile UI and app-unit test bundles (unsigned, no execution)
        run: |
          # Catch shared test-source errors before allocating all runtime shards.
          # Actual XCTest execution remains in the independent jobs below.
          for scheme in Questify QuestifyAppUnitTests; do
            xcodebuild -project Questify.xcodeproj -scheme "$scheme" \
              -configuration Debug -sdk iphonesimulator \
              -destination "platform=iOS Simulator,id=$BUILD_TEST_SIMULATOR_ID" \
              -destination-timeout 60 \
              -derivedDataPath "$RUNNER_TEMP/questify-simulator" \
              CODE_SIGNING_ALLOWED=NO build-for-testing
          done
      - name: Package exact-commit unsigned test products
        run: |
          python3 tools/test_products.py pack \
            --products "$RUNNER_TEMP/questify-simulator/Build/Products" \
            --archive "$RUNNER_TEMP/questify-test-products.tar.gz" --commit "$GITHUB_SHA"
      - name: Share test products within this workflow run
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: test-products-${{ github.sha }}
          path: |
            ${{ runner.temp }}/questify-test-products.tar.gz
            ${{ runner.temp }}/questify-test-products.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
  device-build:
    needs: native
    runs-on: macos-26
    # Cold VM and full SDK-specific source compilation; no cross-SDK cache.
    timeout-minutes: 10
    env:
      EXPECTED_BUILD_FINGERPRINT: ${{ needs.native.outputs.build_fingerprint }}
    outputs:
      build_fingerprint: ${{ steps.identity.outputs.build_fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact builder SHA and Apple toolchain before work
        id: identity
        run: python3 tools/ci_gates.py verify-build --github-output "$GITHUB_OUTPUT"
      - name: Compile iOS device app (unsigned)
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/questify-device" \
            CODE_SIGNING_ALLOWED=NO build
  us-build:
    needs: native
    runs-on: macos-26
    # Cold VM and full SDK-specific source compilation; no cross-SDK cache.
    timeout-minutes: 10
    env:
      EXPECTED_BUILD_FINGERPRINT: ${{ needs.native.outputs.build_fingerprint }}
    outputs:
      build_fingerprint: ${{ steps.identity.outputs.build_fingerprint }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact builder SHA and Apple toolchain before work
        id: identity
        run: python3 tools/ci_gates.py verify-build --github-output "$GITHUB_OUTPUT"
      - name: Compile US regional profile (unsigned)
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify \
            -configuration Release -sdk iphoneos \
            -xcconfig Config/UnitedStates.xcconfig \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/questify-us-device" \
            CODE_SIGNING_ALLOWED=NO build
      - name: Verify built US profile metadata
        run: python3 tools/check_built_profile.py --market US --plist "$RUNNER_TEMP/questify-us-device/Build/Products/Release-iphoneos/Questify.app/Info.plist"
      - name: Verify real source-built GLTFKit2 link and notices (US)
        run: python3 tools/check_gltf_linked.py --app "$RUNNER_TEMP/questify-us-device/Build/Products/Release-iphoneos/Questify.app"
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.24.3'
      - name: Scan full checked-out branch history
        shell: bash
        run: |
          set -euo pipefail
          # The pinned action installs this version and adds its directory to PATH.
          command -v gitleaks >/dev/null
          test "$(gitleaks version)" = '8.24.3'
          # Include merge-parent diffs; do not scan unrelated branch tips with --all.
          gitleaks git --redact --exit-code=2 --log-opts="--full-history -m HEAD"
  app-unit-tests:
    needs: native
    env:
      EXPECTED_BUILD_FINGERPRINT: ${{ needs.native.outputs.build_fingerprint }}
    outputs:
      build_fingerprint: ${{ steps.identity.outputs.build_fingerprint }}
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact builder SHA and Apple toolchain before work
        id: identity
        run: python3 tools/ci_gates.py verify-build --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-products-${{ github.sha }}
          path: ${{ runner.temp }}/test-product-transfer
      - name: Verify and restore same-run test products
        run: |
          python3 tools/test_products.py restore \
            --archive "$RUNNER_TEMP/test-product-transfer/questify-test-products.tar.gz" \
            --destination "$RUNNER_TEMP/prebuilt-tests" --commit "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/simulators.json'))
          candidates=[d for runtime,devices in data['devices'].items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator; App-unit tests cannot be claimed as passed')
          chosen=sorted(candidates,key=lambda d:d['name'])[-1]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TEST_SIMULATOR_ID='+chosen['udid']+'\n')
          print('Selected simulator:',chosen['name'])
          PY
      - name: Boot simulator before app-unit tests
        run: xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
      - name: Run all app-hosted XCTest methods (unsigned)
        run: |
          xcodebuild -xctestrun "$APP_UNIT_XCTESTRUN" \
            -destination "platform=iOS Simulator,id=$TEST_SIMULATOR_ID" \
            -destination-timeout 60 \
            -resultBundlePath "$RUNNER_TEMP/questify-app-unit-results.xcresult" \
            -parallel-testing-enabled NO -maximum-concurrent-test-simulator-destinations 1 \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 60 \
            -maximum-test-execution-time-allowance 120 \
            -only-testing:QuestifyAppUnitTests test-without-building
      - name: Retain app-unit test results briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: app-unit-results-${{ github.sha }}
          path: ${{ runner.temp }}/questify-app-unit-results.xcresult
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
  ui-tests:
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    needs: native
    env:
      EXPECTED_BUILD_FINGERPRINT: ${{ needs.native.outputs.build_fingerprint }}
    outputs:
      shard_0: ${{ steps.completion.outputs.shard_0 }}
      shard_1: ${{ steps.completion.outputs.shard_1 }}
      shard_2: ${{ steps.completion.outputs.shard_2 }}
      shard_3: ${{ steps.completion.outputs.shard_3 }}
      shard_4: ${{ steps.completion.outputs.shard_4 }}
      shard_5: ${{ steps.completion.outputs.shard_5 }}
    runs-on: macos-26
    # Run49 spent 9–13 minutes on setup/build/launch before executing methods.
    # Reuse products; keep a bounded margin for the full shard and result export.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact builder SHA and Apple toolchain before work
        id: identity
        run: python3 tools/ci_gates.py verify-build --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: test-products-${{ github.sha }}
          path: ${{ runner.temp }}/test-product-transfer
      - name: Verify and restore same-run test products
        run: |
          python3 tools/test_products.py restore \
            --archive "$RUNNER_TEMP/test-product-transfer/questify-test-products.tar.gz" \
            --destination "$RUNNER_TEMP/prebuilt-tests" --commit "$GITHUB_SHA" --github-env "$GITHUB_ENV"
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY'
          import json, os
          data=json.load(open(os.environ['RUNNER_TEMP']+'/simulators.json'))
          candidates=[d for runtime,devices in data['devices'].items() if 'iOS' in runtime for d in devices if d.get('isAvailable') and d['name'].startswith('iPhone')]
          if not candidates:
              raise SystemExit('No available iPhone simulator; UI tests cannot be claimed as passed')
          chosen=sorted(candidates,key=lambda d:d['name'])[-1]
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('TEST_SIMULATOR_ID='+chosen['udid']+'\n')
          print('Selected simulator:',chosen['name'])
          PY
      - name: Boot simulator before UI readiness checks
        run: xcrun simctl bootstatus "$TEST_SIMULATOR_ID" -b
      - name: Test native module flows and session boundaries
        run: |
          python3 tools/run_ui_shard.py --shard ${{ matrix.shard }} --count 6 \
            --simulator "$TEST_SIMULATOR_ID" \
            --xctestrun "$UI_XCTESTRUN" --deadline-seconds 1680 \
            --result-bundle "$RUNNER_TEMP/questify-ui-results.xcresult"
      - name: Export offline fixture screenshots
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/questify-ui-attachments"
          if [ -f "$RUNNER_TEMP/questify-ui-results.xcresult/Info.plist" ]; then
            xcrun xcresulttool export attachments \
              --path "$RUNNER_TEMP/questify-ui-results.xcresult" \
              --output-path "$RUNNER_TEMP/questify-ui-attachments"
          else
            echo 'No finalized xcresult. Runtime job remains failed/incomplete; capturing only the current simulator screen for diagnosis.'
            xcrun simctl io "$TEST_SIMULATOR_ID" screenshot "$RUNNER_TEMP/questify-ui-attachments/incomplete-shard-${{ matrix.shard }}.png"
          fi
      - name: Retain synthetic UI screenshots briefly
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: offline-ui-screenshots-${{ github.sha }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/questify-ui-attachments/**/*.png
            ${{ runner.temp }}/questify-ui-attachments/**/*.jpg
            ${{ runner.temp }}/questify-ui-attachments/**/*.txt
            ${{ runner.temp }}/questify-ui-attachments/**/manifest.json
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
      - name: Record successful exact-build UI shard completion
        id: completion
        run: python3 tools/ci_gates.py complete-ui --shard ${{ matrix.shard }} --github-output "$GITHUB_OUTPUT"
  required-native-gates:
    # Keep the pre-split required check name on the complete aggregate.
    name: native
    if: ${{ always() }}
    needs: [native, device-build, us-build, secrets, app-unit-tests, ui-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Require every same-SHA native gate and UI shard to succeed
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python3 tools/ci_gates.py aggregate
