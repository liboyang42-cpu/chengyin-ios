name: Current native checks
on:
  push:
    branches: [main, integration/wave2-20261019, codex/ios-main-integration-20261101, screenshot/codex-ui-20261103]
  workflow_dispatch:
    inputs:
      mode:
        description: Current related groups and smoke, or full current regression
        type: choice
        options: [related, full, screenshot-pilot]
        default: related
      pilot_sha:
        description: Exact reviewed source and workflow SHA for the bounded owner capture pilot only
        required: false
        type: string
        default: ""
permissions:
  contents: read
concurrency:
  group: native-current-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_name != 'screenshot/codex-ui-20261103' }}
jobs:
  controls:
    if: ${{ inputs.mode != 'screenshot-pilot' && github.ref_name != 'screenshot/codex-ui-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      ui_matrix: ${{ steps.plan.outputs.ui_matrix }}
      scope: ${{ steps.plan.outputs.scope }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Current source, declarations, and deletion audit
        run: |
          python3 -B tools/current_ci.py check
          python3 -B -m unittest -v tools.tests.test_current_ci tools.tests.test_current_native tools.tests.test_export_current_ui_audit
          python3 -B tools/check_scaffold.py
          git diff --exit-code
      - name: Select changed current groups plus explicit smoke
        id: plan
        env:
          EVENT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          MODE: ${{ inputs.mode || (github.ref_name == 'integration/wave2-20261019' && 'related' || 'full') }}
        run: |
          base="$EVENT_BASE"
          if [ -z "$base" ] || [ "$base" = 0000000000000000000000000000000000000000 ] || [ "${GITHUB_REF_NAME:-}" = "integration/wave2-20261019" ]; then base="$(git rev-parse HEAD^)"; fi
          python3 -B tools/current_ci.py plan --base "$base" --mode "$MODE" --output "$RUNNER_TEMP/current-plan/plan.json"
          python3 -B - <<'PY'
          import json, os
          from tools.export_current_ui_audit import WANTED
          p=json.load(open(os.environ['RUNNER_TEMP']+'/current-plan/plan.json'))
          wanted={'QuestifyUITests/'+method for method in WANTED}
          priority=[i for i,shard in enumerate(p['ui_shards']) if wanted.intersection(shard['methods'])]
          indices=priority+[i for i in range(len(p['ui_shards'])) if i not in priority]
          assert sorted(indices)==list(range(len(p['ui_shards']))), 'UI scheduling must include every shard exactly once'
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('ui_matrix='+json.dumps({'index':indices},separators=(',',':'))+'\n')
              f.write('scope='+p['scope']+'\n')
          print('Current selected scope:',p['scope'],{k:len(v) for k,v in p['groups'].items()})
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-plan/
          if-no-files-found: error
          retention-days: 1
  secrets:
    if: ${{ inputs.mode != 'screenshot-pilot' && github.ref_name != 'screenshot/codex-ui-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_VERSION: '8.24.3'
      - name: Keep existing complete branch secret scan
        run: |
          test "$(gitleaks version)" = '8.24.3'
          scan_code=0
          gitleaks git --redact --exit-code=2 --log-opts="--full-history -m HEAD" --report-format json --report-path "$RUNNER_TEMP/full-history-gitleaks.json" || scan_code=$?
          metadata_code=0
          python3 -B - <<'PY' || metadata_code=$?
          import json, os
          from pathlib import Path
          allowed={'Commit','File','StartLine','EndLine','RuleID','Fingerprint','Entropy','Tags'}
          report=Path(os.environ['RUNNER_TEMP'])/'full-history-gitleaks.json'
          if report.is_file():
              findings=json.loads(report.read_text())
              assert isinstance(findings,list) and all(isinstance(row,dict) for row in findings), 'Unexpected Gitleaks report shape'
              metadata=[{key:value for key,value in row.items() if key in allowed} for row in findings]
              assert all(set(row)<=allowed and not {'Secret','Match'}.intersection(row) for row in metadata), 'Only finding metadata may be published'
              encoded=json.dumps(metadata,indent=2)+'\n'
              (report.parent/'full-history-gitleaks-metadata.json').write_text(encoded)
              print(encoded,end='')
          PY
          if [ "$scan_code" -ne 0 ]; then exit "$scan_code"; fi
          exit "$metadata_code"
      - name: Preserve only secret-scan finding metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-secret-findings-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-history-gitleaks-metadata.json
          if-no-files-found: ignore
          retention-days: 1
  native:
    if: ${{ inputs.mode != 'screenshot-pilot' && github.ref_name != 'screenshot/codex-ui-20261103' }}
    needs: [controls]
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        partition: [core, app-unit]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record complete job clock
        run: python3 -c 'import os,time,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"current-start").write_text(str(time.monotonic()))'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-plan
      - name: Compile current products and execute the selected native group
        run: python3 -B tools/current_native.py run --plan "$RUNNER_TEMP/current-plan/plan.json" --role '${{ matrix.partition }}' --start-file "$RUNNER_TEMP/current-start" --output "$RUNNER_TEMP/current-native"
      - name: Show compiler errors from failed commands
        if: failure()
        run: |
          grep -h -E '(error|fatal error): ' "$RUNNER_TEMP"/current-native/*.stdout | sort | uniq | head -300 || true
      - name: Preserve exact command and result diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-result-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.partition }}
          path: |
            ${{ runner.temp }}/current-native/*.json
            ${{ runner.temp }}/current-native/*.xml
            ${{ runner.temp }}/current-native/*.stdout
          if-no-files-found: error
          retention-days: 1
  ui_build:
    if: ${{ inputs.mode != 'screenshot-pilot' && github.ref_name != 'screenshot/codex-ui-20261103' }}
    needs: [controls]
    outputs:
      ui_build_artifact: ${{ steps.ui_build_upload.outputs.artifact-id }}
    runs-on: macos-26
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record complete job clock
        run: python3 -c 'import os,time,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"current-start").write_text(str(time.monotonic()))'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-plan
      - name: Compile current products and execute the selected native group
        run: python3 -B tools/current_native.py run --plan "$RUNNER_TEMP/current-plan/plan.json" --role 'ui-build' --start-file "$RUNNER_TEMP/current-start" --output "$RUNNER_TEMP/current-native"
      - name: Show compiler errors from failed commands
        if: failure()
        run: |
          grep -h -E '(error|fatal error): ' "$RUNNER_TEMP"/current-native/*.stdout | sort | uniq | head -300 || true
      - name: Preserve exact command and result diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-diagnostics-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ui-build
          path: |
            ${{ runner.temp }}/current-native/*.json
            ${{ runner.temp }}/current-native/*.xml
            ${{ runner.temp }}/current-native/*.stdout
          if-no-files-found: error
          retention-days: 1
      - name: Transfer one same-run UI build
        id: ui_build_upload
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-ui-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/current-native/receipt.json
            ${{ runner.temp }}/current-native/products.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Transfer same-run UI build identity for platform checks
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-ui-build-metadata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-native/receipt.json
          if-no-files-found: error
          retention-days: 1
  ui:
    needs: [controls, ui_build]
    if: ${{ always() && inputs.mode != 'screenshot-pilot' && github.ref_name != 'screenshot/codex-ui-20261103' && needs.controls.result == 'success' && needs.ui_build.result == 'success' && needs.ui_build.outputs.ui_build_artifact != '' }}
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.controls.outputs.ui_matrix) }}
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Record complete worker clock
        run: python3 -c 'import os,time,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"current-start").write_text(str(time.monotonic()))'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-ui-build-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-ui-build
      - name: Execute complete assigned UI methods without rebuilding
        run: python3 -B tools/current_native.py run --plan "$RUNNER_TEMP/current-plan/plan.json" --role ui --index '${{ matrix.index }}' --build "$RUNNER_TEMP/current-ui-build" --start-file "$RUNNER_TEMP/current-start" --output "$RUNNER_TEMP/current-native"
      - name: Export selected same-run synthetic UI images
        if: success()
        continue-on-error: true
        run: python3 -B -m tools.export_current_ui_audit --plan "$RUNNER_TEMP/current-plan/plan.json" --output "$RUNNER_TEMP/current-native"
      - name: Preserve synthetic UI audit images
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-ui-audit-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ui-${{ matrix.index }}
          path: ${{ runner.temp }}/current-ui-audit-evidence/
          if-no-files-found: ignore
          retention-days: 1
      - name: Show test and compiler errors from failed commands
        if: failure()
        run: |
          grep -h -A 120 -E '(error|fatal error): ' "$RUNNER_TEMP"/current-native/*.stdout | head -600 || true
      - name: Preserve real per-shard results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-result-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ui-${{ matrix.index }}
          path: |
            ${{ runner.temp }}/current-native/*.json
            ${{ runner.temp }}/current-native/*.stdout
          if-no-files-found: error
          retention-days: 1
      - name: Preserve bounded synthetic failure screenshots
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: current-ui-failure-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-ui-${{ matrix.index }}
          path: ${{ runner.temp }}/current-ui-failure-evidence/
          if-no-files-found: ignore
          retention-days: 1
  platforms:
    needs: [controls, ui_build]
    if: ${{ inputs.mode != 'screenshot-pilot' && github.ref_name != 'screenshot/codex-ui-20261103' && needs.controls.result == 'success' && needs.controls.outputs.scope == 'full-current-regression' && needs.ui_build.result == 'success' && needs.ui_build.outputs.ui_build_artifact != '' }}
    runs-on: macos-26
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include:
          - kind: device
            minutes: 45
          - kind: us
            minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-ui-build-metadata-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-ui-identity
      - name: Bind current platform compile to the same source and Apple toolchain
        run: |
          python3 -B - <<'PYCODE'
          import os,subprocess
          from pathlib import Path
          from tools import current_native as n
          root=Path.cwd(); tmp=Path(os.environ['RUNNER_TEMP']); plan=n.verify_plan(root,tmp/'current-plan/plan.json')
          prior=n.read_json(tmp/'current-ui-identity/receipt.json');n.same_identity(prior,plan)
          n.require(prior.get('role')=='ui-build' and prior.get('status')=='BUILT' and prior.get('executed_methods')==[],'Platform compile requires a successful same-run UI build')
          n.require(type(prior.get('build_returncode')) is int and prior['build_returncode']==0,'UI build command did not succeed')
          def run(argv,seconds,stem):
              code,raw=n.execute(argv,root,seconds,True);n.require(type(code) is int and code==0,'Toolchain read failed');return raw
          n.require(n.toolchain(run)==prior.get('toolchain'),'Full platform build changed toolchain')
          PYCODE
      - name: Compile unsigned device app and protected storage bundle
        if: matrix.kind == 'device'
        id: device
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/questify-device" CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project Questify.xcodeproj -scheme QuestifyAppUnitTests -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/questify-device-app-unit" CODE_SIGNING_ALLOWED=NO build-for-testing
      - name: Keep explicit unexecuted physical-device storage boundary
        if: ${{ always() && matrix.kind == 'device' }}
        env:
          DEVICE_COMPILE_OUTCOME: ${{ steps.device.outcome }}
        run: python3 -B tools/report_protected_storage_coverage.py --compile-outcome "$DEVICE_COMPILE_OUTCOME" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/protected-storage-coverage.json" --summary "$GITHUB_STEP_SUMMARY"
      - name: Compile and verify the US regional profile
        if: matrix.kind == 'us'
        run: |
          xcodebuild -project Questify.xcodeproj -scheme Questify -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/questify-us-device" QUESTIFY_MARKET=US QUESTIFY_API_BASE_URL= CODE_SIGNING_ALLOWED=NO build
          python3 -B tools/check_built_profile.py --market US --plist "$RUNNER_TEMP/questify-us-device/Build/Products/Release-iphoneos/Questify.app/Info.plist"
          python3 -B tools/check_gltf_linked.py --app "$RUNNER_TEMP/questify-us-device/Build/Products/Release-iphoneos/Questify.app"
      - name: Confirm platform checks left source unchanged
        run: python3 -B tools/current_ci.py check && git diff --exit-code
  current-checks:
    needs: [controls, secrets, native, ui_build, ui, platforms]
    if: ${{ always() && inputs.mode != 'screenshot-pilot' && github.ref_name != 'screenshot/codex-ui-20261103' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: current-plan-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/current-plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: current-result-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/current-results
          merge-multiple: false
      - name: Reparse actual results and require the complete selected union
        run: python3 -B tools/current_native.py aggregate --plan "$RUNNER_TEMP/current-plan/plan.json" --artifacts "$RUNNER_TEMP/current-results" --output "$RUNNER_TEMP/current-receipt.json"
  screenshot_pilot:
    if: >-
      ${{ github.repository == 'liboyang42-cpu/chengyin-ios' &&
          github.ref == 'refs/heads/screenshot/codex-ui-20261103' &&
          github.event.repository.private == false && github.run_attempt == '1' &&
          ((github.event_name == 'workflow_dispatch' && inputs.mode == 'screenshot-pilot') ||
           (github.event_name == 'push' && github.event.created == false &&
            github.event.deleted == false && github.event.forced == false &&
            github.event.before == 'ab2d3905ec0b0fb17b58ba6b53ec433d83164701' &&
            github.event.after == github.sha && github.event.head_commit.id == github.sha &&
            github.event.head_commit.message == 'UI-PILOT-ONCE: 20261103-g05-m04-cl02')) }}
    runs-on: macos-26
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PILOT_EXPECTED_SHA: ${{ github.event_name == 'push' && github.event.after || inputs.pilot_sha }}
      PILOT_MODE: ${{ inputs.mode }}
      PILOT_PUSH_REF: ${{ github.event.ref }}
      PILOT_PUSH_CREATED: ${{ github.event.created }}
      PILOT_PUSH_DELETED: ${{ github.event.deleted }}
      PILOT_PUSH_FORCED: ${{ github.event.forced }}
      PILOT_PUSH_BEFORE: ${{ github.event.before }}
      PILOT_PUSH_AFTER: ${{ github.event.after }}
      PILOT_PUSH_HEAD_SHA: ${{ github.event.head_commit.id }}
      PILOT_PUSH_HEAD_MESSAGE: ${{ github.event.head_commit.message }}
      PILOT_REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
    steps:
      - name: Record pilot job-entry clock
        run: python3 -c 'import os,time,pathlib; pathlib.Path(os.environ["RUNNER_TEMP"],"pilot-start").write_text(str(time.monotonic()))'
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Validate the bounded pilot controls
        run: python3 -B -m unittest -v tools.tests.test_current_ui_pilot
      - name: Build once and capture the exact owner fixture manifest
        run: python3 -B tools/current_ui_pilot.py --expected-sha "$PILOT_EXPECTED_SHA" --start-file "$RUNNER_TEMP/pilot-start" --output "$RUNNER_TEMP/current-ui-pilot"
      - name: Preserve original pilot images and source-bound results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: screenshot-pilot-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/current-ui-pilot/pilot-manifest.json
            ${{ runner.temp }}/current-ui-pilot/pilot-manifest.sha256
            ${{ runner.temp }}/current-ui-pilot/images/*.png
            ${{ runner.temp }}/current-ui-pilot/export-*/manifest.json
            ${{ runner.temp }}/current-ui-pilot/*.stdout
            ${{ runner.temp }}/current-ui-pilot/pilot.xcresult.tar.gz
          if-no-files-found: error
          retention-days: 1
